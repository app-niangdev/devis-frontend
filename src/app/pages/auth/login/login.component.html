<div class="auth-form">
  <h2 class="auth-form__title">Se connecter</h2>
  <p class="auth-form__desc">Espace administrateur de la plateforme. Les gestionnaires utilisent l’application mobile.</p>

  <div class="alert alert--error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

  <form (ngSubmit)="onSubmit()">
    <div class="field">
      <label class="field__label" for="email">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        name="email"
        class="field__input"
        placeholder="vous@entreprise.com"
        [(ngModel)]="email"
        autocomplete="email"
        required
      />
    </div>

    <div class="field">
      <div class="field__row">
        <label class="field__label" for="password">Mot de passe</label>
        <a routerLink="/auth/forgot-password" class="field__link">Mot de passe oublié ?</a>
      </div>
      <div class="field__password">
        <input
          id="password"
          [type]="isPasswordVisible() ? 'text' : 'password'"
          name="password"
          class="field__input"
          placeholder="••••••••"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />
        <button
          type="button"
          class="field__password-toggle"
          [attr.aria-label]="isPasswordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
          (click)="togglePasswordVisibility()"
        >
          <i class="bi" [class.bi-eye]="!isPasswordVisible()" [class.bi-eye-slash]="isPasswordVisible()"></i>
        </button>
      </div>
    </div>

    <label class="checkbox">
      <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />
      <span>Se souvenir de moi</span>
    </label>

    <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Connexion...' : 'Se connecter' }}
    </button>

    <div class="divider"><span>ou</span></div>

    <button type="button" class="btn-secondary">
      <i class="bi bi-google"></i>
      Continuer avec Google
    </button>

    <p class="auth-form__footer">
      Pas encore de compte ? <a href="#">Créer un compte</a>
    </p>
  </form>
</div>
