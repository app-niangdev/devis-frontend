<div class="auth">
  <aside class="auth__brand">
    <div class="auth__brand-header">
      <img class="auth__brand-logo" src="/brand/sn-devis-logo.png" alt="SN Devis" />
    </div>

    <div class="auth__pitch">
      <h1 class="auth__pitch-title">Des devis professionnels,<br />prêts en quelques minutes.</h1>
      <p class="auth__pitch-desc">
        SN Devis accompagne les artisans et les entreprises du Sénégal, du premier devis jusqu'à l'encaissement de l'acompte.
      </p>

      <ul class="auth__highlights">
        <li *ngFor="let item of highlights">
          <span class="auth__highlights-dot"></span>
          {{ item }}
        </li>
      </ul>
    </div>

    <p class="auth__copyright">© {{ year }} SN Devis. Tous droits réservés.</p>
  </aside>

  <main class="auth__panel">
    <router-outlet></router-outlet>
  </main>
</div>
